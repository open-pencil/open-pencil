# Licenses the crates compiled into html-engine.wasm may carry (`bun run check:licenses`).
# Stylo, Blitz's style engine, is MPL-2.0: file-level copyleft, met by shipping the module with
# THIRD-PARTY-NOTICES.md, which links every crate's source.
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
