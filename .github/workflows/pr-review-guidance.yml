name: PR review guidance

on:
  pull_request_review:
    types: [submitted]
  # Only reads: the job runs the default branch's scripts with read permissions (below).
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created, edited]

concurrency:
  group: pr-review-guidance-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # This job only records CodeRabbit PR review guidance and never runs contributor code.
  pr-review-guidance:
    name: Record PR review guidance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # No local action: this workflow's file comes from the pull request, the checkout from the
      # default branch, so a local action the two name differently would not resolve. Dependencies
      # come from the default branch's lockfile, like the script itself.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install the script's dependencies
        run: bun install --frozen-lockfile --filter @open-pencil/pr-review-guidance-tools

      - name: Record CodeRabbit review guidance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/ci/pr-review-guidance/src/index.ts
