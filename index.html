<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>OpenPencil</title>
    <style>
      :root {
        --loader-bg: #1e1e1e;
        --loader-fg: 255, 255, 255;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --loader-bg: #f3f4f6;
          --loader-fg: 32, 33, 36;
        }
      }
      html[data-theme='dark'] {
        --loader-bg: #1e1e1e;
        --loader-fg: 255, 255, 255;
      }
      html[data-theme='light'] {
        --loader-bg: #f3f4f6;
        --loader-fg: 32, 33, 36;
      }
      body { margin: 0; background: var(--loader-bg); }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: rgb(var(--loader-fg));
        background: var(--loader-bg);
      }
      #boot-splash { transition: opacity 240ms ease-out; }
      #boot-splash[data-state='closing'] { opacity: 0; pointer-events: none; }
      #boot-splash[data-state='closing'] .bar { display: none; }
      #boot-splash > svg { width: 112px; height: auto; }
      /* The mark assembling: outlines draw in, the pieces slide together, colour wipes in. */
      #boot-splash .p { animation: boot-join .55s cubic-bezier(.2,.9,.2,1) both; }
      #boot-splash .p1 { --dx: -44px; --dy: -20px; animation-delay: .33s; }
      #boot-splash .p2 { --dx: 44px; --dy: -20px; animation-delay: .43s; }
      #boot-splash .p3 { --dx: -44px; --dy: 44px; animation-delay: .53s; }
      #boot-splash .w { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: boot-wipe .43s cubic-bezier(.5,0,.2,1) forwards; }
      #boot-splash .w1 { animation-delay: .8s; }
      #boot-splash .w2 { animation-delay: .9s; }
      #boot-splash .w3 { animation-delay: 1s; }
      #boot-splash .s { fill: none; stroke-width: 14; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; stroke-opacity: 0;
        animation: boot-draw .4s cubic-bezier(.2,.7,.1,1) forwards, boot-fade .2s linear forwards; }
      #boot-splash .p1 .s { animation-delay: 0s, 1.17s; }
      #boot-splash .p2 .s { animation-delay: .1s, 1.27s; }
      #boot-splash .p3 .s { animation-delay: .2s, 1.37s; }
      @keyframes boot-join { from { transform: translate(var(--dx), var(--dy)); } to { transform: translate(0, 0); } }
      @keyframes boot-draw { 0% { stroke-dashoffset: 1; stroke-opacity: 0; } 8% { stroke-opacity: 1; } 100% { stroke-dashoffset: 0; stroke-opacity: 1; } }
      @keyframes boot-wipe { to { transform: scale(1); } }
      @keyframes boot-fade { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .p, #boot-splash .w, #boot-splash .s { animation: none; }
        #boot-splash .p, #boot-splash .w { transform: none; }
        #boot-splash .s { stroke-opacity: 0; }
      }
      #boot-splash .bar {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, 92px);
        opacity: 0;
        /* Only for a load that is genuinely slow, well after the mark has assembled. */
        animation: boot-bar-in .3s ease-out 8s forwards;
        width: 100px;
        height: 2px;
        background: rgba(var(--loader-fg), 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      #boot-splash .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: rgba(var(--loader-fg), 0.25);
        border-radius: 1px;
        animation: slide 1s ease-in-out infinite;
      }
      @keyframes boot-bar-in { to { opacity: 1; } }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      /* With reduced motion the bar still waits for a slow load, then appears without moving. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bar { animation-duration: 0s; }
        #boot-splash .bar::after { animation: none; }
      }
      /* Pre-boot support notice; the app CSS never loads when it shows. */
      #boot-notice {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 48px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
        color: rgb(var(--loader-fg));
        background: var(--loader-bg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot-notice img { width: 40px; height: 40px; margin-bottom: 8px; }
      #boot-notice h1 { margin: 0; font-size: 18px; font-weight: 600; }
      #boot-notice p { margin: 0; color: rgba(var(--loader-fg), 0.75); }
      #boot-notice nav { margin-top: 8px; color: rgba(var(--loader-fg), 0.45); }
      #boot-notice a { color: rgb(var(--loader-fg)); text-underline-offset: 3px; }
      #boot-notice details { margin-top: 16px; max-width: 100%; color: rgba(var(--loader-fg), 0.6); }
      #boot-notice summary { cursor: pointer; }
      #boot-notice pre {
        margin: 8px 0 0;
        padding: 12px;
        max-height: 40vh;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        border-radius: 6px;
        background: rgba(var(--loader-fg), 0.06);
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
  </head>

  <body>
    <!-- Outside #app so mounting leaves it in place; boot-splash.ts removes it once the mark
         has assembled and the app is ready. -->
    <div id="boot-splash" role="status" aria-label="Loading OpenPencil">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-75 -50 350 430" width="350" height="430" aria-hidden="true">
        <defs>
          <clipPath id="boot-c1"><path d="M50 0H100V60A40 40 0 0 0 60 100V140H100V200H0V50A50 50 0 0 1 50 0Z"/></clipPath>
          <clipPath id="boot-c2"><path d="M100 0A100 100 0 0 1 100 200V140A40 40 0 0 0 100 60Z"/></clipPath>
          <clipPath id="boot-c3"><path d="M0 200H100V300H50A50 50 0 0 1 0 250Z"/></clipPath>
          <clipPath id="boot-w1"><circle class="w w1" cx="100" cy="100" r="270"/></clipPath>
          <clipPath id="boot-w2"><circle class="w w2" cx="100" cy="100" r="270"/></clipPath>
          <clipPath id="boot-w3"><circle class="w w3" cx="100" cy="100" r="270"/></clipPath>
        </defs>
        <g class="p p1">
          <path clip-path="url(#boot-w1)" fill="#F5501E" d="M50 0H100V60A40 40 0 0 0 60 100V140H100V200H0V50A50 50 0 0 1 50 0Z"/>
          <path class="s" clip-path="url(#boot-c1)" stroke="#F5501E" pathLength="1" d="M50 0H100V60A40 40 0 0 0 60 100V140H100V200H0V50A50 50 0 0 1 50 0Z"/>
        </g>
        <g class="p p2">
          <path clip-path="url(#boot-w2)" fill="#FFD43B" d="M100 0A100 100 0 0 1 100 200V140A40 40 0 0 0 100 60Z"/>
          <path class="s" clip-path="url(#boot-c2)" stroke="#FFD43B" pathLength="1" d="M100 0A100 100 0 0 1 100 200V140A40 40 0 0 0 100 60Z"/>
        </g>
        <g class="p p3">
          <path clip-path="url(#boot-w3)" fill="#9B5CFF" d="M0 200H100V300H50A50 50 0 0 1 0 250Z"/>
          <path class="s" clip-path="url(#boot-c3)" stroke="#9B5CFF" pathLength="1" d="M0 200H100V300H50A50 50 0 0 1 0 250Z"/>
        </g>
      </svg>
      <div class="bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
