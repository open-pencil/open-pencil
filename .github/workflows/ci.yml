name: CI

on:
  # Every base, so stacked pull requests are checked against the PR below them.
  pull_request:
  # The merge queue checks each queued change on top of the ones ahead of it.
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # In the merge queue, reads the queued PR's verified-tree status and the CI run behind it.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its parents; the first parent is the base it merges into.
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Fetch comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Select validation scope
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # In the merge queue, a tree the pull request's CI already passed skips the suites.
          CI_EVENT: ${{ github.event_name }}
          CI_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/ci/policy/src/classify.ts

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup/workspace
      - name: Validate PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bun run check:commits --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  documentation:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.scope == 'docs'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup/workspace
        with:
          packages: 'true'
      - name: Validate the changelog and its fragments
        run: bun run check:changelog
      - name: Validate documentation and generated references
        run: bun run check:docs
      - name: Build documentation and check examples
        run: bun run docs:build

  source-quality:
    name: Code quality
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          packages: 'true'

      - name: Verify formatting
        run: bun run format:check

      - name: Lint TypeScript and Vue
        run: bun run lint

      - name: Typecheck application and SDKs
        run: bun run typecheck

      - name: Typecheck test suites
        run: bun run check:test-types

      - name: Typecheck repository tools
        run: bun run check:tools

      - name: Enforce architecture and type-shape boundaries
        run: bun run check:arch && bun run test:type-shapes

      - name: Build the editor without Cloud
        run: bun run check:cloud-off

      - name: Keep workflow steps to one line of shell
        run: bun run check:workflows

      # actionlint's own image, which also runs ShellCheck over every step's shell.
      - name: Lint workflows and actions
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor@1.32.0

      # Online audits also check that pinned commits belong to their actions and have no advisories.
      - name: Audit workflows and actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github

  package-quality:
    name: Package integrity
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          packages: 'true'

      - name: Cache npm consumer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-consumers-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: npm-consumers-${{ runner.os }}-

      - name: Validate installed package artifacts with Node and Bun
        run: bun run test:packages

      - name: Detect unused dependencies and files
        run: bun run check:deps

      - name: Validate workspace dependency policy
        run: bun run check:monorepo

  repository-quality:
    name: Repository hygiene
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace

      - name: Validate generated brand assets
        run: bun run check:icons

      - name: Validate translations
        run: bun run check:i18n

      - name: Validate documentation links and structure
        run: bun run check:docs

      - name: Validate the changelog and its fragments
        run: bun run check:changelog

      - name: Audit critical dependency vulnerabilities
        run: bun run check:audit

      - name: Scan for committed secrets
        run: bun run check:secrets

      - name: Test repository tooling
        run: bun run test:tools

      - name: Detect duplicated product code and test helpers
        run: bun run test:dupes && bun run test:dupes:helpers

  storybook:
    name: Component workshop
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          packages: 'true'

      - name: Build static Storybook
        run: bun run build-storybook

  native-test-contracts:
    name: Native app contracts
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/open-pencil/native-contracts-ci@sha256:64e6b1b50a988c1cefe2b69ac9d58076fd743b18391fa2dbd1d153eba2be9521
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image has no Rust: rustup alone, which installs the toolchain rust-toolchain.toml pins.
      - name: Install rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          key: native-test

      - uses: ./.github/actions/setup/workspace

      - name: Typecheck native interaction tests
        run: bun run check:native-test

      - name: Generate native brand assets
        run: bun run generate:icons --target desktop

      - name: Compile native-test Tauri feature
        run: cargo check --manifest-path desktop/Cargo.toml --features native-test

  html-engine:
    name: Rust crates
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/html-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace

      # The runner's rustup installs the toolchain rust-toolchain.toml pins.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          key: html-engine

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2

      - name: Check Rust formatting and lints
        run: bun run check:rust

      - name: Check the HTML engine's dependency licenses
        run: bun run check:licenses

      - name: Check the desktop app's dependency licenses
        working-directory: .
        run: bun run check:licenses:desktop

      - name: Build the WebAssembly module
        run: bun run build:wasm

  unit-tests:
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group: [app, cli, core, dom, fig, mcp, render, scene-graph, vue]
    # GitHub appends the group, and a skipped job shows the bare name.
    name: Unit tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          lfs: 'true'
          # Quick shards read only the small fixtures; ci-heavy.yml pulls the large .fig corpora.
          lfs-include: tests/fixtures/gold-preview.fig,tests/fixtures/circle-text.fig,tests/fixtures/slots.fig,tests/fixtures/variable-override-precedence.fig,tests/fixtures/fonts/*

      - name: Build shared Core test dependency
        run: bun --filter @open-pencil/core build

      - name: Run ${{ matrix.group }} unit tests
        run: bun tools/dev/unit-tests/src/run.ts "${{ matrix.group }}"

  feedback-tests:
    name: Feedback service
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace

      - name: Typecheck and test the feedback Worker against a local D1
        run: bun run test:feedback

  cloud-tests:
    name: Cloud package
    needs: changes
    if: needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          packages: 'true'

      - name: Typecheck and run Cloud unit and integration tests
        run: bun run test:cloud

  cloud-storage:
    # No matrix value in the name: GitHub appends it, and a skipped job shows the bare name.
    name: Cloud storage
    needs: changes
    if: needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SeaweedFS: PostgreSQL and SeaweedFS, object-store checks, then the full revision flow.
        # Garage: Garage's S3 compatibility for the object-store checks.
        # Cloudflare Workers: the Worker under wrangler dev, with its relay Durable Object, against
        # PostgreSQL and SeaweedFS.
        store: [SeaweedFS, Garage, Cloudflare Workers]
    env:
      CLOUD_E2E_SCRIPT: ${{ fromJSON('{"SeaweedFS":"test:e2e","Garage":"test:e2e:garage","Cloudflare Workers":"test:e2e:cloudflare"}')[matrix.store] }}
      # Only the Workers run serves the built Cloud site.
      WORKER: ${{ matrix.store == 'Cloudflare Workers' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          packages: 'true'

      # The editor's demo document draws its shader fills at build time in a headless Chromium.
      - name: Install Chromium for the demo document
        if: env.WORKER == 'true'
        uses: ./.github/actions/setup/playwright

      # The Worker serves the editor and the portal as static assets, and every official
      # deployment bundles them.
      - name: Build the Cloud site
        if: env.WORKER == 'true'
        run: bun run build:cloud
      - name: Bundle the official Workers
        if: env.WORKER == 'true'
        run: bun tools/ci/cloud-deploy/src/bundle.ts

      - name: Run Cloud end-to-end tests against ${{ matrix.store }}
        run: bun --filter @open-pencil/cloud "$CLOUD_E2E_SCRIPT"

  result:
    name: CI result
    needs: [changes, commit-messages, documentation, source-quality, package-quality, repository-quality, storybook, native-test-contracts, html-engine, unit-tests, feedback-tests, cloud-tests, cloud-storage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Records the verified tree as a commit status once the gate has passed.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Require successful checks for the selected scope
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun tools/ci/policy/src/gate.ts
      # Lets the merge queue skip the suites when it tests this exact tree. Forks cannot write it,
      # and the queue accepts it only from this run. Recording is an optimization: a failure
      # leaves the queue to run every check, so it must not fail the gate.
      - name: Record the verified tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/ci/policy/src/verified-tree/record.ts
