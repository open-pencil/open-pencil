name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'packages/docs/**'
      - 'openspec/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build packages
        run: bun run build:packages

      - name: Format check
        run: bun run format:check

      - name: Lint source
        run: bun run lint

      - name: Typecheck TypeScript and Vue
        run: bun run typecheck

      - name: Architecture and type-shape checks
        run: bun run check:arch && bun run test:type-shapes

  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build packages
        run: bun run build:packages

      - name: Package, dependency, and monorepo checks
        run: bun run check:packages && bun run check:deps && bun run check:monorepo

  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Repository integrity and security checks
        run: |
          bun run check:i18n
          bun run check:docs
          bun run check:audit
          bun run check:secrets
          bun run test:tools
          bun run test:dupes

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build packages
        run: bun run build:packages

      - name: Build Storybook
        run: bun run build-storybook

  native-test-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: native-test

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: ./.github/actions/setup-bun

      - name: Typecheck native tests
        run: bun run check:native-test

      - name: Check test-only Tauri feature
        run: cargo check --manifest-path desktop/Cargo.toml --features native-test

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group: [app, dom, editor, fig, render, scene, vue]
    name: Unit tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Build Core package
        run: bun --filter @open-pencil/core build

      - name: Run quick unit test shard
        shell: bash
        run: |
          mapfile -t test_files < <(bun tools/unit-tests/src/list.ts "${{ matrix.group }}")
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No tests found for shard ${{ matrix.group }}"
            exit 0
          fi
          bun test "${test_files[@]}"
        env:
          BUN_HEAVY_TESTS: 'false'
