[package]
name = "open_pencil"
version = "0.17.0-beta.2"
description = "OpenPencil desktop app"
authors = ["Danila Poyarkov"]
edition = "2021"

[features]
default = ["wry"]
wry = ["dep:tauri-runtime-wry"]
cef = ["dep:tauri-runtime-cef"]
native-test = ["dep:tauri-plugin-automation"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "OpenPencil"
path = "src/main.rs"

[lib]
name = "open_pencil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "=1.0.9", features = ["build"] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = ["devtools"] }
tauri-runtime-wry = { version = "3.0.0-alpha.5", features = ["devtools"], optional = true }
tauri-runtime-cef = { version = "3.0.0-alpha.6", features = ["devtools"], optional = true }
tauri-plugin-opener = "3.0.0-alpha"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-dialog = "3.0.0-alpha"
tauri-plugin-fs = { version = "3.0.0-alpha", features = ["watch"] }
tauri-plugin-shell = "3.0.0-alpha"
tauri-plugin-notification = "3.0.0-alpha"
zstd = "0.13"
zip = { version = "2", default-features = false }
which = "7.0.3"
semver = "1"
fontique = "0.11"
# The same read-fonts fontique uses, to read each face's style names and named instances.
read-fonts = "0.41"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", branch = "dev" }
tauri-plugin-updater = "3.0.0-alpha"
tauri-plugin-process = "3.0.0-alpha"
tauri-plugin-os = "3.0.0-alpha"
tauri-plugin-clipboard-manager = "3.0.0-alpha"
tauri-plugin-deep-link = "3.0.0-alpha"
keyring = "4.1.5"
url = "2"
httparse = "1"
tauri-plugin-automation = { version = "3.0.0-alpha.2", optional = true }

[dev-dependencies]
write-fonts = "=0.50.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
swift-rs = "=1.0.9"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFSet", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontDescriptor"] }

# Tauri's own copy, to read the WebKitGTK version before the webview starts (`explicit_sync`).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "3.0.0-alpha", features = ["deep-link"] }

