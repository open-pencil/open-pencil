# cloud-staging.openpencil.dev, the official staging deployment. Secrets come from the Worker's
# secrets: BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY, and OPENPENCIL_CLOUD_SERVICES_SIGNING_KEY; DATABASE_URL is Hyperdrive's.
schema_version = 2

# Staging is only for people the team approved: no editor or shared files without signing in.
[deployment]
mode = "official"
public_url = "https://cloud-staging.openpencil.dev"
indexing = "deny"
local_editor = false

[database]

[authentication.enrollment]
mode = "approval"
notification_emails = ["admin@openpencil.dev"]

[authentication.email_password]
enabled = false

[authentication.trusted_proxies]
headers = ["cf-connecting-ip"]
addresses = []

[authentication.providers.google]
client_id = { from_env = "GOOGLE_CLIENT_ID" }

[object_storage]
endpoint = "https://br-lucky-forest-aeigmjr4.storage.c-2.us-east-2.aws.neon.tech"
region = "us-east-2"
bucket = "openpencil-cloud-staging"
force_path_style = true
checksum_verification = "metadata"

[documents]
retention_days = 30

# OpenPencil services' staging Worker, which trusts this Cloud's tokens.
[services]
endpoint = "https://services-staging.openpencil.dev"

[email]
transport = "cloudflare"
from = "cloud@openpencil.dev"

[entitlements]
source = "static"

[entitlements.documents]
maximum_file_bytes = 1_073_741_824
revision_history = true

[entitlements.storage]
maximum_bytes = 107_374_182_400

[entitlements.sharing]
links = true
guest_view = true
guest_edit = false
guest_presence = true

[entitlements.collaboration]
enabled = true
maximum_participants = 100

# 10,000 credits is $10 of model use a month per workspace, at 1 credit = $0.001.
[entitlements.services]
enabled = true
monthly_credit_allowance = 10_000

# Server errors go to the OpenPencil PostHog project; the key is the POSTHOG_PROJECT_API_KEY secret.
[error_tracking]
provider = "posthog"
host = "https://eu.i.posthog.com"
