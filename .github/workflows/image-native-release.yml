name: Build native release CI image

# Publishes ghcr.io/open-pencil/native-release-ci, the environment build.yml builds the Linux desktop
# release in, and proves each build of it bundles the app before a release pins its digest. A pull
# request's image is tagged with its commit only; master's also moves `ubuntu-22.04`.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ci/images/native-release/Dockerfile'
      - '.github/workflows/image-native-release.yml'
  push:
    branches: [master]
    paths:
      - 'tools/ci/images/native-release/Dockerfile'
      - '.github/workflows/image-native-release.yml'

permissions:
  contents: read

concurrency:
  group: native-release-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/open-pencil/native-release-ci

jobs:
  publish:
    name: Publish native release image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/ci/images/native-release
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.pull_request.head.sha || github.sha }}${{ github.event_name != 'pull_request' && format(',{0}:ubuntu-22.04', env.IMAGE) || '' }}
          cache-from: type=gha,scope=native-release-image
          cache-to: type=gha,scope=native-release-image,mode=max

  # An unsigned build of the app in the image, as the release builds it, without updater artifacts.
  bundle:
    name: Bundle the app in the image
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    container:
      image: ghcr.io/open-pencil/native-release-ci@${{ needs.publish.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Cache Rust builds # zizmor: ignore[cache-poisoning]
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          key: native-release-image
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: ./.github/actions/setup/workspace
        with:
          cache-scope: desktop
          cache-save: 'false'

      - name: Build the deb, rpm, and AppImage
        run: node node_modules/@tauri-apps/cli/tauri.js build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Require every Linux bundle
        run: ls target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
