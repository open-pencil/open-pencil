name: Cloud image

# Publishes ghcr.io/open-pencil/cloud, the server with the editor and pages it serves, for each
# published release, and builds it without publishing when its inputs change in a pull request.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild the image for (vX.Y.Z or vX.Y.Z-beta.N).
        required: true
        type: string
  pull_request:
    paths:
      - 'packages/cloud/deploy/Dockerfile'
      - 'packages/cloud/deploy/Dockerfile.dockerignore'
      - '.github/workflows/image-cloud.yml'

permissions:
  contents: read

concurrency:
  group: cloud-image-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build Cloud image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}
          persist-credentials: false

      # The setup action as of this workflow's commit, since a rebuilt release's tree may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .pipeline
          persist-credentials: false

      # The HTML engine's WebAssembly module, built here where it is cached and Rust is installed;
      # the image builds everything else from the context, which carries the module. Releases from
      # before the engine have none to build.
      - uses: ./.pipeline/.github/actions/setup/workspace
        with:
          cache-scope: cloud-image

      - name: Build the HTML engine's WebAssembly module
        if: hashFiles('packages/html-engine/package.json') != ''
        run: bun run --filter @open-pencil/html-engine build:wasm

      # A rebuild of an older release must not move latest back to it.
      - name: Find the latest release
        id: latest
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      # vX.Y.Z is tagged X.Y.Z, X.Y, and latest if it is the latest release; a prerelease only its
      # version and next.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/open-pencil/cloud
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=next,enable=${{ contains(env.RELEASE_TAG, '-') }}
            type=ref,event=pr
          flavor: latest=${{ env.PUBLISH == 'true' && steps.latest.outputs.tag == env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND MIT

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: packages/cloud/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cloud-image
          cache-to: type=gha,scope=cloud-image,mode=max

