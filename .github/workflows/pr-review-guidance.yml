name: PR review guidance

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

concurrency:
  group: pr-review-guidance-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # This job only records CodeRabbit PR review guidance and never runs contributor code.
  pr-review-guidance:
    name: Record PR review guidance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Dependencies come from the default branch's lockfile, like the script itself.
      - uses: ./.github/actions/setup-bun
        with:
          install-args: --frozen-lockfile --filter @open-pencil/pr-review-guidance-tools
          cache-scope: pr-review-guidance

      - name: Record CodeRabbit review guidance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/ci/pr-review-guidance/src/index.ts
