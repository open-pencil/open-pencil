services:
  cloud:
    build:
      context: ../../..
      dockerfile: packages/cloud/deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      PORT: 8787
      OPENPENCIL_CLOUD_DEPLOYMENT: ${OPENPENCIL_CLOUD_DEPLOYMENT:-self-hosted}
      OPENPENCIL_CLOUD_URL: ${OPENPENCIL_CLOUD_URL:-http://localhost:8787}
      OPENPENCIL_CLOUD_TRUSTED_ORIGINS: ${OPENPENCIL_CLOUD_TRUSTED_ORIGINS:-http://localhost:5173}
      OPENPENCIL_CLOUD_ENROLLMENT_MODE: ${OPENPENCIL_CLOUD_ENROLLMENT_MODE:-open}
      OPENPENCIL_CLOUD_ENROLLMENT_ADMIN_EMAILS: ${OPENPENCIL_CLOUD_ENROLLMENT_ADMIN_EMAILS:-}
      OPENPENCIL_CLOUD_ADMIN_USER_IDS: ${OPENPENCIL_CLOUD_ADMIN_USER_IDS:-}
      OPENPENCIL_CLOUD_CLEANUP_ENABLED: ${OPENPENCIL_CLOUD_CLEANUP_ENABLED:-true}
      OPENPENCIL_CLOUD_CLEANUP_BATCH_SIZE: ${OPENPENCIL_CLOUD_CLEANUP_BATCH_SIZE:-100}
      OPENPENCIL_CLOUD_CLEANUP_INTERVAL_MS: ${OPENPENCIL_CLOUD_CLEANUP_INTERVAL_MS:-60000}
      OPENPENCIL_CLOUD_CLEANUP_LEASE_MS: ${OPENPENCIL_CLOUD_CLEANUP_LEASE_MS:-300000}
      OPENPENCIL_CLOUD_EMAIL_TRANSPORT: ${OPENPENCIL_CLOUD_EMAIL_TRANSPORT:-none}
      OPENPENCIL_CLOUD_EMAIL_BATCH_SIZE: ${OPENPENCIL_CLOUD_EMAIL_BATCH_SIZE:-50}
      OPENPENCIL_CLOUD_EMAIL_INTERVAL_MS: ${OPENPENCIL_CLOUD_EMAIL_INTERVAL_MS:-30000}
      OPENPENCIL_CLOUD_EMAIL_LEASE_MS: ${OPENPENCIL_CLOUD_EMAIL_LEASE_MS:-300000}
      OPENPENCIL_CLOUD_EMAIL_MAXIMUM_ATTEMPTS: ${OPENPENCIL_CLOUD_EMAIL_MAXIMUM_ATTEMPTS:-5}
      OPENPENCIL_CLOUD_DOCUMENT_RETENTION_MS: ${OPENPENCIL_CLOUD_DOCUMENT_RETENTION_MS:-2592000000}
      DATABASE_URL: postgresql://openpencil:${POSTGRES_PASSWORD:-openpencil-development-password}@postgres:5432/openpencil
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-at-least-32-random-characters}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-openpencil}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-openpencil}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-openpencil-development-secret}
      S3_FORCE_PATH_STYLE: "true"
      S3_CHECKSUM_VERIFICATION: ${S3_CHECKSUM_VERIFICATION:-metadata}
    ports:
      - "${OPENPENCIL_CLOUD_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8787/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openpencil
      POSTGRES_USER: openpencil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpencil-development-password}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpencil -d openpencil"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - cloud-postgres:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
    volumes:
      - cloud-seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs-init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-openpencil}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-openpencil-development-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-openpencil}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $${S3_BUCKET}
        || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket $${S3_BUCKET}

volumes:
  cloud-postgres:
  cloud-seaweedfs:
