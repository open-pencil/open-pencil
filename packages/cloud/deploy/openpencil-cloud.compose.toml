schema_version = 2

[deployment]
mode = "self-hosted"
public_url = "http://localhost:8787"
app_url = "http://localhost:5173"
indexing = "deny"
trusted_origins = ["http://localhost:5173"]

[database]

[authentication]
enrollment_mode = "open"
admin_notification_emails = []

[authentication.trusted_proxies]
headers = []
addresses = []

[object_storage]
endpoint = "http://seaweedfs:8333"
region = "us-east-1"
bucket = "openpencil"
force_path_style = true
checksum_verification = "metadata"

[email]
transport = "none"

[workers.email]
batch_size = 50
interval_ms = 30000
lease_ms = 300000
maximum_attempts = 5

[workers.cleanup]
enabled = true
batch_size = 100
interval_ms = 60000
lease_ms = 300000
document_retention_days = 30

[entitlements]
source = "static"

[entitlements.documents]
maximum_file_bytes = 1_073_741_824
revision_history = true

[entitlements.storage]
maximum_bytes = 1_099_511_627_776

[entitlements.sharing]
capability_links = true
anonymous_view = true
anonymous_edit = true
guest_presence = true

[entitlements.collaboration]
enabled = true
maximum_participants = 100

[technical_limits]
maximum_upload_bytes = 1073741824
maximum_collaboration_message_bytes = 1048576
maximum_connections_per_room = 1000
