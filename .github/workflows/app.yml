name: Deploy app

on:
  push:
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:

jobs:
  deploy:
    # Pre-releases (vX.Y.Z-beta.N) ship desktop and npm builds only, never production,
    # including when dispatched manually on their tag.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - name: Format check
        run: bun run format:check

      # The demo document's shader fills are drawn at build time in a headless Chromium.
      - uses: ./.github/actions/setup-playwright

      - run: bun run build
        env:
          # Official releases only: lets the app send its daily ping and, with consent, usage stats.
          VITE_OPENPENCIL_FEEDBACK: "on"

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=openpencil-app --branch=master
