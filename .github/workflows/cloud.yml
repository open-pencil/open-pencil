name: Deploy Cloud

# Deploys an official OpenPencil Cloud deployment: packages/cloud/deploy/openpencil/<target>, with
# the secrets and reviewers of the cloud-<target> GitHub environment.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment
        type: choice
        options: [staging]

concurrency:
  group: cloud-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloud-${{ inputs.target }}
      url: ${{ vars.CLOUD_URL }}
    permissions:
      contents: read
      deployments: write
    env:
      DEPLOYMENT: packages/cloud/deploy/openpencil/${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # The editor's demo document draws its shader fills at build time in a headless Chromium.
      - uses: ./.github/actions/setup-playwright

      # The Worker serves the editor and the portal as static assets. The editor names this
      # deployment as the official server and, like app.openpencil.dev, sends the daily ping.
      - name: Build the Cloud site
        env:
          VITE_OPENPENCIL_OFFICIAL_CLOUD_URL: ${{ vars.CLOUD_URL }}
          VITE_OPENPENCIL_FEEDBACK: "on"
        run: bun run build:packages && bun run build:cloud

      # Migrations run before the new code, over the direct connection rather than Hyperdrive. The
      # config reads every secret it names, so only this step and the next one see them.
      - name: Migrate the database
        env:
          OPENPENCIL_CLOUD_CONFIG: ${{ github.workspace }}/${{ env.DEPLOYMENT }}/openpencil-cloud.toml
          DATABASE_URL: ${{ secrets.NEON_MIGRATOR_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: bun --filter @open-pencil/cloud migrate

      - name: Collect the Worker's secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          jq -n '{BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET, S3_ACCESS_KEY_ID: env.S3_ACCESS_KEY_ID,
            S3_SECRET_ACCESS_KEY: env.S3_SECRET_ACCESS_KEY}' > "$RUNNER_TEMP/cloud-secrets.json"

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.DEPLOYMENT }}
          packageManager: bun
          command: >-
            deploy --assets ${{ github.workspace }}/dist-cloud
            --secrets-file ${{ runner.temp }}/cloud-secrets.json

      - name: Check the deployment
        env:
          CLOUD_URL: ${{ vars.CLOUD_URL }}
        # Only a 200 counts: a redirect to a sign-in or access page would mean the Worker isn't there.
        # Pages are asked for as a browser does; the API is not, so a missing route can't turn into
        # the editor's page.
        run: |
          for path in /health /ready /.well-known/openpencil / /welcome /auth/sign-in; do
            accept='application/json'
            case "$path" in /|/welcome|/auth/*) accept='text/html' ;; esac
            status=$(curl --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
              --header "Accept: $accept" \
              --output /dev/null --write-out '%{http_code}' "$CLOUD_URL$path")
            if [ "$status" != 200 ]; then
              echo "::error::$path answered HTTP $status"
              exit 1
            fi
          done
