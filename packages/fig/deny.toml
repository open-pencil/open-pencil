# Licenses the crates compiled into fig.wasm may carry (`bun run check:licenses`).
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  # unicode-ident, which serde's derive macros read identifiers with.
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
