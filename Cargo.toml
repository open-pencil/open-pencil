# Every Rust crate in the repository: the desktop app, and the crates npm packages build to
# WebAssembly, each in its package's `crate/`. One lockfile, one toolchain (`rust-toolchain.toml`),
# and one `target/`.
[workspace]
resolver = "3"
members = ["desktop", "packages/html-engine/crate"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# WebAssembly modules build for size with `--profile wasm`; the desktop app keeps the release
# profile's defaults, built for speed.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Taffy from open-pencil/taffy's `openpencil/taffy` branch: the commit Blitz pins plus the layout
# fixes that wait on upstream (its OPENPENCIL.md), so HTML import and auto layout, which runs on
# that branch's release in packages/taffy, share one Taffy. Move `rev` with packages/taffy's pin.
[patch."https://github.com/DioxusLabs/taffy"]
taffy = { git = "https://github.com/open-pencil/taffy", rev = "f0c51f71f3a1a6f40bb78be49e08716d34ca57e9" }
