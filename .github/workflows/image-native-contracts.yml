name: Build native contracts CI image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/ci/images/native-contracts/Dockerfile'
      - '.github/workflows/image-native-contracts.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: native-contracts-image
  cancel-in-progress: true

jobs:
  publish:
    name: Publish native contracts image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/ci/images/native-contracts
          push: true
          tags: |
            ghcr.io/open-pencil/native-contracts-ci:ubuntu-24.04
            ghcr.io/open-pencil/native-contracts-ci:${{ github.sha }}
          # No layer cache: each build installs the packages current that day, which is how a rebuild
          # brings their security updates.
          no-cache: true
