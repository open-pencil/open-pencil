name: Deploy docs

on:
  # The download page reads GitHub's releases when the site is built, so the docs deploy when a
  # release is published, not when its tag is pushed and the release is still a draft.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and capture the landing posters without deploying; the stills are kept as an artifact.
        type: boolean
        default: false

jobs:
  build:
    # Pre-releases (vX.Y.Z-beta.N) ship desktop and npm builds only, never production,
    # including when dispatched manually on their tag.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      posters-cached: ${{ steps.posters.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          packages: 'true'

      # The stills depend only on the sources the fingerprint covers, so a deploy that changed
      # none of them, such as one that edits documentation, takes them from an earlier run.
      - name: Fingerprint the landing posters
        id: fingerprint
        run: echo "fingerprint=$(bun tools/generate/landing-posters/src/generate.ts --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Look for the landing posters of these sources
        id: posters
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/landing-posters
          key: landing-posters-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

      - run: bun run --filter @open-pencil/docs build:site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: packages/docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 1

  # Capturing the landing's stills renders every stage in software WebGL, so the pages are spread
  # over runners, and only when no earlier run captured them from the same sources.
  posters:
    needs: build
    if: ${{ needs.build.outputs.posters-cached != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          cache-save: 'false'

      - name: Install Chromium for landing posters
        uses: ./.github/actions/setup/playwright

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: packages/docs/.vitepress/dist

      - run: bun tools/generate/landing-posters/src/generate.ts --shard ${{ matrix.shard }}/4

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-posters-${{ matrix.shard }}
          path: .cache/landing-posters
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: [build, posters]
    # The posters job is skipped when the stills are cached, and must otherwise have succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.posters.result == 'success' || needs.posters.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup/workspace
        with:
          cache-save: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: packages/docs/.vitepress/dist

      - name: Take the cached landing posters
        if: ${{ needs.build.outputs.posters-cached == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/landing-posters
          key: landing-posters-${{ needs.build.outputs.fingerprint }}
          fail-on-cache-miss: true

      - name: Gather the captured landing posters
        if: ${{ needs.build.outputs.posters-cached != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: landing-posters-*
          merge-multiple: true
          path: .cache/landing-posters

      - name: Add the landing posters to the site
        run: bun tools/generate/landing-posters/src/generate.ts --assemble

      # Kept once every still is in place, which --assemble has just checked.
      - name: Keep the landing posters for the next deploy
        if: ${{ needs.build.outputs.posters-cached != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/landing-posters
          key: landing-posters-${{ needs.build.outputs.fingerprint }}

      - name: Keep the landing posters for review
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-posters
          path: packages/docs/.vitepress/dist/landing-posters

      # A published release has no inputs, so it always deploys.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: ${{ !inputs.dry-run }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/docs/.vitepress/dist --project-name=openpencil-docs --branch=master
