[package]
name = "open-pencil-html-engine"
version = "0.0.0"
description = "Lays HTML out with Blitz and captures every node's box, computed styles, and text lines."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Blitz at DioxusLabs/blitz#1279's head, which requests atomic inline baselines from Taffy so
# inline-block and inline-flex boxes sit on their lines; move to a main commit once it merges.
[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "f540c664d6c37cbe1a232880223b28ef4a56f2af", default-features = false, features = ["svg", "woff", "floats"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "f540c664d6c37cbe1a232880223b28ef4a56f2af" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "f540c664d6c37cbe1a232880223b28ef4a56f2af" }
# Stylo as Blitz builds it, for computed values Blitz resolves to used ones; keep it at Blitz's rev.
style = { git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3", package = "stylo" }
parley = { version = "0.12", default-features = false, features = ["std"] }
serde_json = "1"
