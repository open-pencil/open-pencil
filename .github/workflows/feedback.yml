name: Deploy feedback service

on:
  push:
    branches: [master]
    paths:
      - packages/feedback/**
      # The waitlist's email layout, which Cloud's email module shares with the Worker.
      - packages/cloud/src/email/**
      - packages/cloud/src/contract/**
      # The metrics dashboard page the Worker serves under /admin. Its bundle is built from the
      # app's src/ (views, components, theme, styles, and the build target in
      # src/app/shell/support) and this package, so any change there redeploys it.
      - src/**
      - metrics.html
      - package.json
      - bun.lock
      - vite.config.ts
      - vite/**
  workflow_dispatch:

concurrency:
  group: feedback-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - name: Typecheck and test against a local D1
        run: bun run test:feedback

      # Wrangler uploads dist-metrics/ as the Worker's static assets.
      - name: Build the metrics dashboard page
        run: bun run build:packages && bun run build:metrics

      # Migrations run before the new code, so it never queries a table that is not there yet.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/feedback
          packageManager: bun
          command: |
            d1 migrations apply feedback --remote
            deploy
