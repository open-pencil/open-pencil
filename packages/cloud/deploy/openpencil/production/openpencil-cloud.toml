# cloud.openpencil.dev, the official deployment. Secrets come from the Worker's secrets:
# BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
# OPENPENCIL_CLOUD_SERVICES_SIGNING_KEY, and POSTHOG_PROJECT_API_KEY; DATABASE_URL is Hyperdrive's.
# Its database and bucket are in the EU.
schema_version = 2

# Anyone may open the editor and shared files; accounts are approved until sign-up opens.
[deployment]
mode = "official"
public_url = "https://cloud.openpencil.dev"
indexing = "allow"
local_editor = true

[database]

[authentication.enrollment]
mode = "approval"
notification_emails = ["admin@openpencil.dev"]

[authentication.email_password]
enabled = false

# Deployment administrators confirm a second step before the admin console opens.
[authentication.mfa]
required_for_admins = true
totp = true
recovery_codes = true

[authentication.trusted_proxies]
headers = ["cf-connecting-ip"]
addresses = []

[authentication.providers.google]
client_id = { from_env = "GOOGLE_CLIENT_ID" }

# Replace with the EU bucket's endpoint, region, and name.
[object_storage]
endpoint = "https://your-eu-bucket-endpoint.invalid"
region = "eu-central-1"
bucket = "openpencil-cloud"
force_path_style = true
checksum_verification = "metadata"

[documents]
retention_days = 30
purge_grace_days = 7

# OpenPencil services' production Worker, which trusts this Cloud's tokens.
[services]
endpoint = "https://services.openpencil.dev"

[email]
transport = "cloudflare"
from = "cloud@openpencil.dev"

[entitlements]
source = "static"

[entitlements.documents]
maximum_file_bytes = 1_073_741_824
revision_history = true

[entitlements.storage]
maximum_bytes = 107_374_182_400

[entitlements.sharing]
links = true
guest_view = true
guest_edit = false
guest_presence = true

[entitlements.collaboration]
enabled = true
maximum_participants = 100

# 10,000 credits is $10 of model use a month per account, at 1 credit = $0.001.
[entitlements.services]
enabled = true
monthly_credit_allowance = 10_000

# Server errors go to the OpenPencil PostHog project, on its EU Cloud.
[error_tracking]
provider = "posthog"
