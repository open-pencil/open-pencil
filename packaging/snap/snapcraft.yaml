# Packs the release .deb, built for the snap's architecture and copied here as openpencil.deb.
# Run `snapcraft pack` in this folder; packaging/AGENTS.md has the rules.
name: openpencil
base: core24
# Version from the .deb; title, summary, description, license, and links from the AppStream
# metainfo it installs (desktop/linux/net.dannote.open-pencil.metainfo.xml).
adopt-info: openpencil
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  openpencil:
    command: usr/bin/OpenPencil
    desktop: usr/share/applications/OpenPencil.desktop
    extensions: [gnome]
    environment:
      # The Snap Store delivers updates, and the sandbox cannot start host programs
      # (desktop/src/capabilities.rs).
      OPENPENCIL_SELF_UPDATE: '0'
      OPENPENCIL_HOST_PROCESSES: '0'
    plugs:
      - home
      - network
      - removable-media
      - password-manager-service

# tauri-plugin-single-instance names the running instance after the app identifier, and a
# second launch hands it its files and links over the session bus. The slot lets the snap own
# that name; its own second launch reaches it without a plug.
slots:
  single-instance:
    interface: dbus
    bus: session
    name: net.dannote.open-pencil.SingleInstance

parts:
  openpencil:
    plugin: nil
    source: .
    parse-info: [usr/share/metainfo/net.dannote.open-pencil.metainfo.xml]
    override-build: |
      dpkg-deb -x openpencil.deb "$CRAFT_PART_INSTALL"
      craftctl set version="$(dpkg-deb -f openpencil.deb Version)"
      # Snap desktop files name their icon by path inside the snap.
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/OpenPencil.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/OpenPencil.desktop"
    prime:
      - -openpencil.deb
